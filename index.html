<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BitOK CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=1779456000">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="logo">G</div>
      <div class="brand-text">
        <div class="brand-name">Guru Outreach</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="settings-btn" title="Настройки бэкенда" data-pix="settings"></button>
      <button class="icon-btn" id="topbar-toggle" title="Скрыть/показать шапку">▴</button>
    </div>
  </header>

  <main id="screen-root"></main>

  <nav class="tabbar">
    <button class="tab" data-screen="dashboard">
      <span class="tab-ico" data-pix="home"></span><span class="tab-lbl">Главная</span>
    </button>
    <button class="tab" data-screen="outreach">
      <span class="tab-ico" data-pix="paper_plane"></span><span class="tab-lbl">Аутрич</span>
    </button>
    <button class="tab" data-screen="inbox">
      <span class="tab-ico" data-pix="inbox"></span><span class="tab-lbl">Inbox</span>
    </button>
    <button class="tab" data-screen="guru">
      <span class="tab-ico" data-pix="ninja"></span><span class="tab-lbl">Guru</span>
    </button>
    <button class="tab" data-screen="more">
      <span class="tab-ico" data-pix="dot3"></span><span class="tab-lbl">Ещё</span>
    </button>
  </nav>
</div>

<script src="api.js?v=1779456000"></script>
<script src="app.js?v=1779456000"></script>
</body>
</html>
